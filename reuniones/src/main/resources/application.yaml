server:
  port: 8080

logging:
  level:
    org:
      springframework:
        jdbc:
          datasource:
            init:
              ScriptUtils: debug

spring:

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/Springboot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  data:
    rest:
      base-path: "api/rest"

  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      roles: "USER"
      show-details: "when_authorized"
---

spring:
  config:
    activate:
      on-profile: desarrollo

server:
  port: 8081

---

spring:
  config:
    activate:
      on-profile: pruebas

server:
  port: 8082

---

spring:
  config:
    activate:
      on-profile: produccion

server:
  port: 9000